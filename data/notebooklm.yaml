    question: "Sự kiện giao hàng xảy ra lúc 10:02 nhưng tới hệ thống lúc 10:08. Bạn muốn báo cáo theo thời điểm giao hàng. Cần dùng thời gian nào, và báo cáo 10:00–10:05 có thể cần sửa lại không?"
    check: "Phân nhóm theo event time 10:02. Cần chính sách dữ liệu đến muộn và cập nhật kết quả; không thể chọn một watermark hợp lý nếu chưa có yêu cầu độ trễ và phân bố đến muộn. Chưa có lab Kafka/Flink trong trang này."
