    question: "Một ngày có ba đơn: hoàn tất 40000 đồng, hủy 50000 đồng, hoàn tất 60000 đồng. Nếu chỉ tính đơn hoàn tất, doanh thu và số đơn là bao nhiêu?"
    check: "100000 đồng, 2 đơn. Đây là dữ liệu giả lập tính bằng tay; chưa phải lab PostgreSQL của toàn khóa."
