    question: "Bạn đọc một thư mục có 100 file Parquet. Writer thay thế 20 file trong lúc bạn đang đọc. Chỉ dùng tên thư mục đã đủ để đảm bảo báo cáo đọc một phiên bản nhất quán chưa? Hãy giải thích snapshot sẽ giúp ở đâu."
    check: "Chỉ có thư mục không xác định một snapshot nguyên tử. Table format có thể chỉ rõ tập file của một snapshot được commit; còn cần engine, catalog và cơ chế commit tương thích. Chưa có lab Spark/Iceberg trong trang này."
