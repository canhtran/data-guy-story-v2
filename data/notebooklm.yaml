    question: "Một đơn 100000 đồng có hai lần thử thanh toán: một thất bại, một thành công. JOIN hai bảng rồi cộng tiền đơn sẽ ra bao nhiêu? Bạn sẽ giữ grain của báo cáo thế nào?"
    check: "JOIN trực tiếp cả hai lần thử làm tổng thành 200000 đồng. Tổng đơn đúng là 100000 đồng. Cần định nghĩa báo cáo và tránh nhân dòng, chẳng hạn kiểm tra tồn tại thanh toán thành công khi chỉ cần biết đã thu tiền. Chưa có lab dbt/Airflow trong trang này."
