    check: "Thư mục riêng không tự đảm bảo quyền database, quyền file, secret hay giới hạn tài nguyên. Cần quyền được thực thi và thử cả truy cập được phép lẫn bị từ chối. Chưa có lab platform hoặc cấu hình phân quyền hoàn chỉnh trong trang này."
