<div class="dgs-path-grid">
  {{ range $i, $item := hugo.Data.learning_paths }}
    {{ with site.GetPage $item.page }}
      <a class="dgs-path-card" href="{{ .RelPermalink }}" aria-label="Xem chi tiết lộ trình {{ $item.title }}">
        <span class="dgs-path-head"><span class="dgs-path-number">{{ printf "%02d" (add $i 1) }}</span><span class="dgs-path-flow" aria-hidden="true"><i></i><i></i><i></i></span></span>
        <strong class="dgs-path-title">{{ $item.title }}</strong>
        <span class="dgs-card-audience">{{ $item.audience }}</span>
        {{ with $item.outcome }}<span>{{ . }}</span>{{ end }}
        <span class="dgs-card-project"><span class="dgs-project-label">PROJECT</span><span class="dgs-project-name">{{ $item.project }}</span></span>
        <span class="dgs-route-link">View learning path</span>
      </a>
    {{ end }}
  {{ end }}
</div>
