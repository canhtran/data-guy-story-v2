# Hugo configuration file
title: Data Guy Story

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

outputs:
  home: [html, llms]
  page: [html]
  section: [html, rss]

menu:
  main:
    - name: Sổ tay
      pageRef: /docs
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - name: Về tui
      pageRef: /about
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: Youtube
      weight: 5
      url: "https://www.youtube.com/@DataGuyStory"
      params:
        icon: youtube
    - name: Facebook
      weight: 6
      url: "https://www.facebook.com/DataGuyStory"
      params:
        icon: facebook

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      # dark: images/logo-dark.svg
      link: /
      width: 40
      height: 20

  blog:
    list:
      displayTags: true

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: false