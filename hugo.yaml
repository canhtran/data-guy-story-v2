# Hugo configuration file
baseURL: "https://dataguystory.com/"
title: Data Guy Story
languageCode: vi-VN
defaultContentLanguage: vi
enableRobotsTXT: true

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

menu:
  main:
    - name: Sổ tay
      pageRef: /wiki
      weight: 1
    - name: Lộ trình học
      pageRef: /learning-paths
      weight: 2
    - name: Chuyện thực tế
      pageRef: /stories
      weight: 3
    - name: Blog
      pageRef: /blog
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: Youtube
      weight: 6
      url: "https://www.youtube.com/@DataGuyStory"
      params:
        icon: youtube
    - name: Facebook
      weight: 7
      url: "https://www.facebook.com/DataGuyStory"
      params:
        icon: facebook

params:
  description: "Sổ tay Data Engineering bằng tiếng Việt: kiến thức nền tảng, lộ trình học, công nghệ và những câu chuyện kỹ thuật thực tế."

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      # dark: images/logo-dark.svg
      link: /
      width: 40
      height: 20

  blog:
    list:
      displayTags: true
      pagerSize: 10

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: false

  imageZoom:
    enable: true
